[workspace]
members = ["crates/gaeb-core", "crates/gaeb-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/benjosua/gaeb-rs"

[workspace.lints.rust]
